name: Syndicate Blog

on:
  workflow_call:
    inputs:
      release_tag:
        description: 'Release tag that was just deployed; posts changed since the previous tag are syndicated'
        type: string
        required: true
    secrets:
      DEVTO_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Re-syndicate ALL non-draft posts (ignores content hash)'
        type: boolean
        default: false
      slug:
        description: 'Syndicate a single slug (filename without .mdx)'
        type: string
        default: ''
      dry_run:
        description: 'Parse and validate, but do not publish'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  syndicate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release range
        id: range
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          previous_tag=$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)
          echo "Syndicating posts changed between ${previous_tag:-<none>} and ${RELEASE_TAG}"
          echo "before=${previous_tag}" >> "$GITHUB_OUTPUT"
          echo "after=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore syndication state cache
        uses: actions/cache@v4
        with:
          path: .syndication.json
          key: syndication-state-v1-${{ github.run_id }}
          restore-keys: syndication-state-v1-

      - name: Run syndication
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          SITE_URL: https://vineethnk.in
          DRY_RUN: ${{ inputs.dry_run || false }}
          BACKFILL: ${{ inputs.backfill || false }}
          SLUG: ${{ inputs.slug || '' }}
          GITHUB_EVENT_BEFORE: ${{ steps.range.outputs.before }}
          GITHUB_EVENT_AFTER: ${{ steps.range.outputs.after }}
        run: node scripts/syndicate.mjs
